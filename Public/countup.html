<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Count Up · 9.991s</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0f0f0f;
        --surface: #1a1a1a;
        --border: #2a2a2a;
        --accent: #e8d5a3;
        --accent-dim: #b5a47e;
        --text: #f0ece0;
        --muted: #7a7670;
      }
      html, body { height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: 'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 28px;
      }
      h1 {
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.12em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 22px;
      }
      .display {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 18px;
      }
      .elapsed {
        font-size: 56px;
        font-weight: 500;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      .target {
        color: var(--muted);
        font-size: 16px;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        position: relative;
        height: 14px;
        background: #232323;
        border: 1px solid var(--border);
        border-radius: 7px;
        overflow: hidden;
        margin-bottom: 22px;
      }
      .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-dim), var(--accent));
        border-radius: 7px 0 0 7px;
        transition: width 60ms linear;
      }
      .controls {
        display: flex;
        gap: 10px;
      }
      button {
        flex: 1;
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.04em;
        transition: background 0.15s, border-color 0.15s, color 0.15s;
      }
      button:hover { border-color: var(--accent-dim); }
      button.primary {
        background: var(--accent);
        color: #0f0f0f;
        border-color: var(--accent);
      }
      button.primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
      button:disabled { opacity: 0.4; cursor: default; border-color: var(--border); }
      .meta {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Count Up Timer</h1>
      <div class="display">
        <span id="elapsed" class="elapsed">0.000</span>
        <span class="target">/ 9.991 s</span>
      </div>
      <div class="bar"><div id="fill" class="fill"></div></div>
      <div class="controls">
        <button id="startBtn" class="primary">Start</button>
        <button id="resetBtn">Reset</button>
      </div>
      <div class="meta">
        <span id="status">Ready</span>
        <span id="percent">0%</span>
      </div>
    </div>

    <script>
      const TARGET_MS = 9991;
      const elapsedEl = document.getElementById('elapsed');
      const fillEl = document.getElementById('fill');
      const startBtn = document.getElementById('startBtn');
      const resetBtn = document.getElementById('resetBtn');
      const statusEl = document.getElementById('status');
      const percentEl = document.getElementById('percent');

      let startTs = null;
      let rafId = null;
      let finished = false;

      function render(ms) {
        const clamped = Math.min(ms, TARGET_MS);
        const seconds = clamped / 1000;
        elapsedEl.textContent = seconds.toFixed(3);
        const pct = (clamped / TARGET_MS) * 100;
        fillEl.style.width = pct + '%';
        percentEl.textContent = pct.toFixed(1) + '%';
      }

      function tick(now) {
        const elapsed = now - startTs;
        if (elapsed >= TARGET_MS) {
          render(TARGET_MS);
          finished = true;
          statusEl.textContent = 'Finished';
          startBtn.textContent = 'Start';
          startBtn.disabled = true;
          rafId = null;
          return;
        }
        render(elapsed);
        rafId = requestAnimationFrame(tick);
      }

      function start() {
        if (finished) return;
        if (rafId !== null) return;
        startTs = performance.now() - (parseFloat(elapsedEl.textContent) * 1000 || 0);
        statusEl.textContent = 'Running';
        startBtn.textContent = 'Pause';
        rafId = requestAnimationFrame(tick);
      }

      function pause() {
        if (rafId === null) return;
        cancelAnimationFrame(rafId);
        rafId = null;
        statusEl.textContent = 'Paused';
        startBtn.textContent = 'Resume';
      }

      function reset() {
        if (rafId !== null) cancelAnimationFrame(rafId);
        rafId = null;
        startTs = null;
        finished = false;
        render(0);
        statusEl.textContent = 'Ready';
        startBtn.textContent = 'Start';
        startBtn.disabled = false;
      }

      startBtn.addEventListener('click', () => {
        if (rafId === null) start();
        else pause();
      });
      resetBtn.addEventListener('click', reset);

      render(0);
    </script>
  </body>
</html>
